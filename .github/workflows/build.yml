name: Build IPK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SDK
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7621/openwrt-sdk-23.05.5-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          ls -lh openwrt-sdk-*.tar.xz

      - name: Verify SDK
        run: |
          if [ ! -f openwrt-sdk-*.tar.xz ]; then
            echo "ERROR: SDK download failed"
            exit 1
          fi
          if [ $(stat -c%s openwrt-sdk-*.tar.xz) -lt 1000000 ]; then
            echo "ERROR: SDK file too small, download may be corrupted"
            exit 1
          fi
          echo "SDK download verified"

      - name: Extract SDK
        run: |
          tar xf openwrt-sdk-*.tar.xz
          SDK_DIR=$(ls -d openwrt-sdk-*/)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK extracted to: $SDK_DIR"

      - name: Setup package
        run: |
          mkdir -p "${{ env.SDK_DIR }}package/luci-app-ssh-guard/files"
          cp Makefile "${{ env.SDK_DIR }}package/luci-app-ssh-guard/"
          cp -r files/* "${{ env.SDK_DIR }}package/luci-app-ssh-guard/files/"
          cp -r luasrc "${{ env.SDK_DIR }}package/luci-app-ssh-guard/"
          cp -r root/* "${{ env.SDK_DIR }}package/luci-app-ssh-guard/"

      - name: Build
        run: |
          cd "${{ env.SDK_DIR }}"
          make package/luci-app-ssh-guard/compile V=sc

      - name: Find IPK
        id: find
        run: |
          IPK=$(find "${{ env.SDK_DIR }}bin" -name "luci-app-ssh-guard_*.ipk" | head -1)
          echo "IPK=$IPK" >> $GITHUB_OUTPUT
          echo "Found: $IPK"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-ssh-guard
          path: ${{ steps.find.outputs.IPK }}
